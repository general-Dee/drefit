<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0A0A0B" />
<title>Drefit · Offline</title>
<style>
  :root{--bg:#0A0A0B;--s2:#17171A;--s3:#1F1F23;--ink:#F5F5F4;--muted:#A1A1AA;--subtle:#8B8B94;--accent:#C8F135;--line:rgba(255,255,255,.08)}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;text-align:center;overflow:hidden}
  body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(520px 420px at 50% 30%,rgba(200,241,53,.12),transparent 70%)}
  .logo{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:18px;letter-spacing:-.02em;margin-bottom:40px}
  .logo b{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#DDFB72,#C8F135 45%,#B1E01F);color:var(--bg);font-size:14px}
  .card{position:relative;width:100%;max-width:400px;padding:32px 24px;border-radius:20px;background:var(--s2);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 24px 56px -20px rgba(0,0,0,.85);animation:up .5s cubic-bezier(.22,1,.36,1) both}
  .card::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(200,241,53,.6),transparent)}
  .icon{display:grid;place-items:center;width:56px;height:56px;margin:0 auto 20px;border-radius:16px;background:var(--s3);border:1px solid rgba(255,255,255,.12);color:var(--accent)}
  .eyebrow{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
  h1{margin:0 0 8px;font-size:26px;line-height:32px;letter-spacing:-.025em;font-weight:700}
  p{margin:0 auto;color:var(--muted);max-width:320px;font-size:15px;line-height:1.55}
  .actions{display:flex;flex-direction:column;gap:8px;margin-top:28px}
  a,button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;font:600 15px/1 inherit;font-family:inherit;text-decoration:none;cursor:pointer;transition:transform .12s cubic-bezier(.22,1,.36,1)}
  a:active,button:active{transform:scale(.97)}
  .primary{background:linear-gradient(135deg,#DDFB72,#C8F135 45%,#B1E01F);color:var(--bg);border:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 24px -10px rgba(200,241,53,.55)}
  .secondary{background:rgba(255,255,255,.03);color:var(--ink);border:1px solid rgba(255,255,255,.12)}
  a:focus-visible,button:focus-visible{outline:none;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
  @keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.card{animation:none}a,button{transition:none}}
</style>
</head>
<body>
  <div class="logo"><b>D</b>Drefit</div>
  <main class="card">
    <div class="icon" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M5 12.86a10 10 0 0 1 5.17-2.69"/><path d="M19 12.86a10 10 0 0 0-2-1.43"/><path d="M2 8.82a15 15 0 0 1 4.18-2.65"/><path d="M22 8.82a15 15 0 0 0-11.29-3.76"/><path d="m2 2 20 20"/></svg>
    </div>
    <div class="eyebrow">Offline</div>
    <h1>You're offline</h1>
    <p>Workouts you've opened before are still available. Completed workouts are saved and will sync when you're back online.</p>
    <div class="actions">
      <a class="primary" href="/dashboard/workouts">Open my workouts</a>
      <button class="secondary" type="button" onclick="location.reload()">Try again</button>
    </div>
  </main>
</body>
</html>
